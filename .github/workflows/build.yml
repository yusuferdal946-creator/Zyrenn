name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      emulator:
        description: "Emülatör (instrumented) testlerini de çalıştır"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  # 1-4) Kaynak/proje kontrolü, belge tutarlılığı, gizli anahtar taraması, güvenlik politikası
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 1) Kaynak ve proje kontrolü (dosyalar, sürüm tutarlılığı, test sayısı)
        run: python3 scripts/check_project.py
      - name: 2) Belge tutarlılığı (12 özellik korunuyor, kanıtsız TAMAM yok)
        run: python3 scripts/check_docs.py
      - name: 3) Gizli anahtar taraması
        run: |
          if grep -rIn -E "AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|BEGIN (RSA|EC|PRIVATE) KEY" --exclude-dir=.git --exclude-dir=scripts --exclude=build.yml . ; then
            echo "Kaynakta olası gizli anahtar bulundu"; exit 1; fi
      - name: 4) Güvenlik politikası denetimi
        run: python3 scripts/check_policy.py

  # 5) Birim testleri
  unit-tests:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Birim testleri
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace --continue
      - name: Sonuç özeti (gerçek sayılar)
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r=ET.parse(p).getroot()
              t+=int(r.get("tests",0)); f+=int(r.get("failures",0)); e+=int(r.get("errors",0)); s+=int(r.get("skipped",0))
          print(f"### Birim testleri\n- toplam: {t}\n- başarısız: {f}\n- hata: {e}\n- atlanan: {s}" if t else "### Birim testleri\nSonuç dosyası yok: test aşamasına ulaşılamadı (derleme hatası olabilir).")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

  # 6, 10) APK derlemesi + Wrapper
  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: zyren-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Gradle Wrapper üret
        run: gradle wrapper --gradle-version 8.11.1 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-dosyalari
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error

  # 7) Lint: gerçek hatalar işi kırmızı yapar (gizlenmez); APK işi bundan bağımsızdır
  lint:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Lint
        run: gradle :app:lintDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

  # 8) İsteğe bağlı emülatör testleri: yalnızca elle (Run workflow > emulator işaretli). Çalışmazsa kırmızı görünür, başarılı sayılmaz.
  emulator-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.emulator
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests
          if-no-files-found: warn
